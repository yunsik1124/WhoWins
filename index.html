<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 커스텀 게임 아케이드</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --neon-blue: #66fcf1;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --edit-bg: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--neon-blue);
            font-size: 1rem;
            opacity: 0.8;
        }

        .guide-banner {
            background: rgba(102, 252, 241, 0.05);
            border: 1px dashed rgba(102, 252, 241, 0.3);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 2.5rem;
            text-align: center;
            max-width: 600px;
            font-size: 0.9rem;
            color: #a9b7c6;
        }

        .arcade-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 700px;
        }

        .game-row {
            background: var(--card-bg);
            border: 1px solid rgba(102, 252, 241, 0.15);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .game-row:hover {
            border-color: var(--neon-pink);
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.2);
        }

        .editable-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            transition: background-color 0.2s, outline 0.2s;
            flex-grow: 1;
            margin-right: 1.5rem;
        }

        .editable-title:hover {
            background-color: var(--edit-bg);
            outline: 1px dashed var(--neon-blue);
            cursor: text;
        }

        .editable-title:focus {
            background-color: var(--edit-bg);
            outline: 2px solid var(--neon-pink);
            color: #fff;
        }

        .play-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            white-space: nowrap;
        }

        .play-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            transform: scale(1.03);
        }

        footer {
            margin-top: auto;
            padding: 4rem 0 1rem 0;
            color: #a9b7c6;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Web Arcade</h1>
        <p>1열 미니멀 에디션</p>
    </header>

    <div class="guide-banner">
        💡 <strong>게임 제목</strong>을 클릭하면 그 자리에서 이름을 바꿀 수 있습니다. (다른 곳 클릭 시 저장)
    </div>

    <main class="arcade-list" id="arcadeList">
    </main>

    <footer>
        <p>© 2026 WEB GAME ARCADE STUDIO. 시스템 정상 가동 중.</p>
    </footer>

    <script>
        // 🚀 중요: 코드 수정 후 반영 안 될 때는 이 버전 번호를 아무 숫자(예: "1.2")로 올리면 즉시 강제 갱신됩니다!
        const PAGE_VERSION = "1.1";

        const defaultGames = [
            { id: "game_1", title: "Game 1: 누가이겨?" },
            { id: "game_2", title: "Game 2: 두더지 게임" },
            { id: "game_3", title: "Game 3: color shot" },
            { id: "game_4", title: "Game 4: 강철의 난" },
            { id: "game_5", title: "Game 5: 합치다 보니 신이 되었다." },
            { id: "game_6", title: "Game 6: ." },
            { id: "game_7", title: "Game 7: ." },
            { id: "game_8", title: "Game 8: ." },
            { id: "game_9", title: "Game 9: ." },
            { id: "game_10", title: "Game 10: ." }
        ];

        // 버전 대조 후 초기화 처리 기믹
        const currentVersion = localStorage.getItem('arcade_page_version');
        if (currentVersion !== PAGE_VERSION) {
            localStorage.removeItem('arcade_game_data_simple'); // 예전 데이터 완전 파괴
            localStorage.setItem('arcade_page_version', PAGE_VERSION); // 새로운 버전 주입
        }

        let savedGames = JSON.parse(localStorage.getItem('arcade_game_data_simple'));
        if (!savedGames) {
            savedGames = defaultGames;
            localStorage.setItem('arcade_game_data_simple', JSON.stringify(savedGames));
        }

        const listContainer = document.getElementById('arcadeList');

        function renderArcade() {
            listContainer.innerHTML = '';
            savedGames.forEach((game) => {
                const row = document.createElement('div');
                row.className = 'game-row';

                row.innerHTML = `
                    <h2 class="game-title editable-title" contenteditable="true" data-id="${game.id}">${game.title}</h2>
                    <button class="play-btn" onclick="location.href='${game.id}/index.html'">PLAY 🎮</button>
                `;
                listContainer.appendChild(row);
            });

            bindEditEvents();
        }

        function bindEditEvents() {
            const editables = document.querySelectorAll('.editable-title');
            
            editables.forEach(element => {
                element.addEventListener('blur', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const newText = e.target.innerText.trim();

                    const gameIndex = savedGames.findIndex(g => g.id === id);
                    if (gameIndex !== -1) {
                        savedGames[gameIndex].title = newText;
                        localStorage.setItem('arcade_game_data_simple', JSON.stringify(savedGames));
                    }
                });

                element.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        e.target.blur();
                    }
                });
            });
        }

        renderArcade();
    </script>
</body>
</html>
